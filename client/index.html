<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#1e293b" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/favicon.ico" />
    <!-- Display fonts offered in the editor's font picker (match autofingers.com) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Permanent+Marker&family=Special+Elite&display=swap"
    />
    <title>Beijer.ink</title>
    <!-- Apply the saved Text size before paint to avoid a reflow flash.
         Keep these values in sync with fontScaleValues in FontScaleContext.tsx. -->
    <script>
      (function () {
        try {
          var sizes = { default: '100%', large: '112.5%', larger: '125%' };
          var saved = localStorage.getItem('beijer-ink-font-scale');
          if (saved && sizes[saved]) document.documentElement.style.fontSize = sizes[saved];
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
